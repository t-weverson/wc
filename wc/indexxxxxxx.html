<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidor indisponível</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { font-size: 17px; line-height: 1.5; color: #555; }
    @media (prefers-color-scheme: dark) {
      body { background: #121417; color: #eee; }
      .card { background: #1e2126; box-shadow: none; }
      p { color: #bbb; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Servidor indisponível</h1>
    <p>Estamos com problema no servidor de hospedagem. Tente acessar novamente mais tarde!</p>
  </div>
</body>
</html>
